# Matugen-generated Starship configuration
# Auto-generated from wallpaper - do not edit manually

format = """
[┌─](bold #92cef6) $time $username$hostname$directory$git_branch$git_status$python$cmd_duration
[└─](bold #92cef6) $character
"""

add_newline = true

[time]
disabled = false
format = '[\[$time\]](bold #92cef6) '
time_format = "%H:%M:%S"

[username]
style_user = "bold #82d3e2"
style_root = "bold #ffb2b9"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname](bold #95d5a7) "
disabled = false

[directory]
style = "bold #afc6ff"
truncation_length = 3
truncate_to_repo = false
format = "in [$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "bold #e4b7f3"
format = "on [$symbol$branch]($style) "
symbol = "󰊢 "

[git_status]
style = "bold #ccc0e9"
format = "[$all_status$ahead_behind]($style)"

[python]
style = "bold #b8cf84"
format = "via [${symbol}${pyenv_prefix}(${version})(\\($virtualenv\\))]($style) "
symbol = " "
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "__init__.py", "pyproject.toml", "requirements.txt", "setup.py", "tox.ini"]

[cmd_duration]
min_time = 2_000
style = "bold #92cef6"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold #95d5a7)"
error_symbol = "[❯](bold #ffb2b9)"

[nodejs]
style = "bold #95d5a7"
format = "via [${symbol}(${version})]($style) "
symbol = " "

[rust]
style = "bold #ccc0e9"
format = "via [${symbol}(${version})]($style) "
symbol = " "

[docker_context]
style = "bold #afc6ff"
format = "via [${symbol}$context]($style) "
symbol = " "

[package]
style = "bold #e4b7f3"
format = "pkg [${symbol}${version}]($style) "
symbol = "󰏗 "

[memory_usage]
disabled = false
threshold = 70
style = "bold #ccc0e9"
format = "via [${symbol}${ram}]($style) "
symbol = "󰍛 "

[battery]
full_symbol = "🔋"
charging_symbol = "⚡️"
discharging_symbol = "💀"

[[battery.display]]
threshold = 10
style = "bold #ffb2b9"

[[battery.display]]
threshold = 30
style = "bold #b8cf84"

[status]
style = "bold #ffb2b9"
symbol = "✖"
format = '[\[$symbol $common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
disabled = false

[aws]
style = "bold #92cef6"
format = "on [${symbol}($profile)(\\($region\\))]($style) "
symbol = "☁️  "

[kubernetes]
style = "bold #82d3e2"
format = "on [${symbol}$context(\\($namespace\\))]($style) "
symbol = "⎈ "
disabled = false

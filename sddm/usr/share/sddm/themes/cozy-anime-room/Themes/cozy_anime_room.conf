[General]
#################### General ####################

# Screen resolution - adjust to match your display
ScreenWidth="1920"
ScreenHeight="1080"
ScreenPadding="10"

# Font settings
Font="Roboto"
FontSize="14"

# Virtual keyboard for touch screens or accessibility
KeyboardSize="0.4"

# Rounded corners
RoundCorners="15"

# Time and date formatting
Locale=""
HourFormat="HH:mm:ss"
DateFormat="dddd, MMMM d"

# Header text
HeaderText="Welcome Athoms"
subheaderText="おかえりなさい アトムス"

#################### Background ####################

# Wallpaper - synced with matugen
Background="/home/athoms/dotfiles/wallpapers/gargantua-black-1920x1200-9621.jpg"
BackgroundSpeed="1.0"
PauseBackground="false"

# Slight dim to make text more readable
DimBackground="0.2"

# Crop to fill screen while maintaining aspect ratio
CropBackground="true"
BackgroundHorizontalAlignment="center"
BackgroundVerticalAlignment="center"

#################### Colors ####################

# Text colors
HeaderTextColor="#dfe3e7"
DateTextColor="#c1c7ce"
TimeTextColor="#dfe3e7"

# Form background
FormBackgroundColor="#1c2024"
BackgroundColor="#101417"
DimBackgroundColor="#000000"

# Input fields
LoginFieldBackgroundColor="#262a2e"
PasswordFieldBackgroundColor="#262a2e"
LoginFieldTextColor="#dfe3e7"
PasswordFieldTextColor="#dfe3e7"
UserIconColor="#92cef6"
PasswordIconColor="#92cef6"

# Placeholder and warning colors
PlaceholderTextColor="#c1c7ce"
WarningColor="#ffb4ab"

# Button colors
LoginButtonTextColor="#00344c"
LoginButtonBackgroundColor="#92cef6"
SystemButtonsIconsColor="#b6c9d8"
SessionButtonTextColor="#dfe3e7"
VirtualKeyboardButtonTextColor="#dfe3e7"

# Dropdown menu colors
DropdownTextColor="#dfe3e7"
DropdownSelectedBackgroundColor="#374955"
DropdownBackgroundColor="#1c2024"

# Highlight colors
HighlightTextColor="#342b4b"
HighlightBackgroundColor="#ccc0e9"
HighlightBorderColor="#8b9198"

# Hover states
HoverUserIconColor="#ccc0e9"
HoverPasswordIconColor="#ccc0e9"
HoverSystemButtonsIconsColor="#ccc0e9"
HoverSessionButtonTextColor="#ccc0e9"
HoverVirtualKeyboardButtonTextColor="#ccc0e9"

#################### Form ####################

# Blur effects
PartialBlur="true"
FullBlur="false"
BlurMax="32"
Blur="1.0"

# Form positioning
HaveFormBackground="true"
FormPosition="right"

#################### Virtual Keyboard ####################

VirtualKeyboardPosition="right"

#################### Interface Behavior ####################

HideVirtualKeyboard="false"
HideSystemButtons="false"
HideLoginButton="false"

ForceLastUser="true"
PasswordFocus="true"
HideCompletePassword="true"
AllowEmptyPassword="false"
AllowUppercaseLettersInUsernames="false"
BypassSystemButtonsChecks="false"
RightToLeftLayout="false"

#################### Translation ####################

TranslatePlaceholderUsername="Username / ユーザー名"
TranslatePlaceholderPassword="Password / パスワード"
TranslateLogin="Login / ログイン"
TranslateLoginFailedWarning="Login failed! / ログインに失敗しました！"
TranslateCapslockWarning="Caps Lock is on / Caps Lockがオンです"
TranslateSuspend="Sleep / スリープ"
TranslateHibernate="Hibernate / 休止状態"
TranslateReboot="Restart / 再起動"
TranslateShutdown="Shutdown / シャットダウン"
TranslateSessionSelection="Session / セッション"
TranslateVirtualKeyboardButtonOn="Virtual Keyboard (ON)"
TranslateVirtualKeyboardButtonOff="Virtual Keyboard (OFF)"

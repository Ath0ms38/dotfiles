# === TRANSPARENT TERMINAL THEME ===

# Enable remote control for dynamic color reloading
allow_remote_control yes
listen_on unix:@kitty-{kitty_pid}

# Shell Configuration
shell zsh

# Dynamic colors from Matugen (wallpaper-based theming)
include colors.conf

# Transparency & Background
background_opacity 0.8
dynamic_background_opacity yes
background_blur 16

# Cursor style (colors come from colors.conf)
cursor_shape beam
cursor_blink_interval 0.5

# Window Styling
window_margin_width 8
window_padding_width 6 10
placement_strategy top-left
remember_window_size yes
initial_window_width 120c
initial_window_height 35c

# Borders (draw_minimal_borders only, colors from colors.conf)
draw_minimal_borders yes

# Tab Bar (colors come from colors.conf)
tab_bar_edge top
tab_bar_style powerline
tab_bar_margin_width 2
active_tab_font_style bold

# Font Configuration
font_family JetBrainsMono Nerd Font Regular
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0
adjust_line_height 110%
adjust_column_width 0

# Performance
repaint_delay 8
input_delay 0
sync_to_monitor no

# Mouse
mouse_hide_wait 3.0
url_color #74b9ff
url_style curly
open_url_with default
copy_on_select yes

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.0

# Transparency Controls
map ctrl+shift+a>1 set_background_opacity 1.0
map ctrl+shift+a>2 set_background_opacity 0.95
map ctrl+shift+a>3 set_background_opacity 0.90
map ctrl+shift+a>4 set_background_opacity 0.85
map ctrl+shift+a>5 set_background_opacity 0.80
map ctrl+shift+a>6 set_background_opacity 0.75

# Window Management
map ctrl+shift+n new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# Enhanced Key Bindings
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# Hyprlock — themed by matugen via the shared Hyprland color variables.
# $wallpaper, $primary, $background, $foreground, $surface, $outline, $error
# all come from conf/colors.conf (regenerated on every wallpaper change).
source = ~/.config/hypr/conf/colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 2, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.15
}

# Clock
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 110
    color = rgb($foreground)
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +"%A %-d %B"
    font_family = $font
    font_size = 22
    color = rgb($primary)
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Greeting
label {
    monitor =
    text =   $USER
    font_family = $font
    font_size = 16
    color = rgb($foreground)
    position = 0, -120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 55
    position = 0, -190
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 16
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    inner_color = rgba(0, 0, 0, 0.45)
    outer_color = rgb($outline)
    font_color = rgb($foreground)
    font_family = $font

    check_color = rgb($primary)
    fail_color = rgb($error)
    capslock_color = rgb($error)

    placeholder_text = <span alpha="60%"> Mot de passe</span>
    fail_text = <i>$PAMFAIL <b>($ATTEMPTS)</b></i>

    fade_on_empty = false
}

# Battery, bottom-right corner (empty on desktop)
label {
    monitor =
    text = cmd[update:30000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); [ -n "$b" ] && echo "󰁹 $b%"
    font_family = $font
    font_size = 14
    color = rgb($outline)
    position = -30, 30
    halign = right
    valign = bottom
}

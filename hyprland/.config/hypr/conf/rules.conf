##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Special workspaces for apps (dedicated)
# workspace = 11, gapsin:0, gapsout:0
# workspace = 12, gapsin:0, gapsout:0
# workspace = 13, gapsin:0, gapsout:0

# Window rules for app workspaces - force specific apps to their workspaces
windowrule = workspace 11, match:class ^(discord)$
windowrule = workspace 12, match:class ^(Code)$
windowrule = workspace 13, match:class ^(PrismLauncher)$
windowrule = workspace 13, match:class ^(Minecraft)$
windowrule = workspace 14, match:class ^(steam)$

# Prevent other apps from staying in special workspaces by moving them to workspace 1
windowrule {
  name = move-non-discord-from-11
  match:workspace = 11
  match:class = ^(?!discord$).*
  workspace = 1
}

windowrule {
  name = move-non-code-from-12
  match:workspace = 12
  match:class = ^(?!Code$).*
  workspace = 1
}

windowrule {
  name = move-non-games-from-13
  match:workspace = 13
  match:class = ^(?!(PrismLauncher|Minecraft)$).*
  workspace = 1
}

windowrule {
  name = move-non-steam-from-14
  match:workspace = 14
  match:class = ^(?!steam$).*
  workspace = 1
}

# Eww widget integration
windowrule = float on, match:class (eww)
windowrule = decorate off, match:class (eww)
windowrule = no_shadow on, match:class (eww)

windowrule {
  name = eww-popup-no-focus
  match:class = (eww)
  match:title = (.*popup.*)
  no_focus = on
}

# Layer rules for various widgets
layerrule = blur on, match:namespace eww
layerrule = ignore_alpha 0.69, match:namespace eww
layerrule = blur on, match:namespace gtk-layer-shell
layerrule = blur on, match:namespace fabric
layerrule = ignore_alpha 0.50, match:namespace fabric

# Homescreen desktop dashboard — frosted glass + animated appear/disappear
layerrule = blur on, match:namespace homescreen
layerrule = ignore_alpha 0.50, match:namespace homescreen
layerrule = animation popin 88%, match:namespace homescreen

# Kando menu rules
windowrule = no_blur on, match:class kando
windowrule = opaque on, match:class kando
windowrule = size 100% 100%, match:class kando
windowrule = decorate off, match:class kando
windowrule = no_anim on, match:class kando
windowrule = float on, match:class kando
windowrule = pin on, match:class kando

layerrule = blur on, match:namespace ax-notch
layerrule = ignore_alpha 0.50, match:namespace ax-notch

# Swaync notification center
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.50, match:namespace swaync-control-center
layerrule = ignore_alpha 0.50, match:namespace swaync-notification-window

# Rofi launcher
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.50, match:namespace rofi

# VS Code transparency for blur effect
windowrule = opacity 0.98 0.96, match:class ^(Code)$

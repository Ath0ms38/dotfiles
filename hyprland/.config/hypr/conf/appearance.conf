#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 2

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # Colors are loaded from colors.conf (generated by Matugen from wallpaper)
    # Variables like $primary contain 6-char hex (e.g., "8d6e63")
    col.active_border = rgb($primary) rgb($secondary) 45deg
    col.inactive_border = rgb($outline)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgb($shadow)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4
        passes = 1
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Medium bouncy curves
    bezier = softPop, 0.26, 1.0, 0.48, 1.0
    bezier = bounce, 0.2, 1.2, 0.36, 1.0
    bezier = snappy, 0.3, 0.0, 0.2, 1.0
    bezier = smooth, 0.4, 0.0, 0.2, 1.0
    bezier = linear, 0, 0, 1, 1

    # Global default
    animation = global, 1, 4, smooth

    # Window animations - noticeable bounce
    animation = windows, 1, 4, bounce
    animation = windowsIn, 1, 5, bounce, popin 70%
    animation = windowsOut, 1, 3, snappy, popin 85%
    animation = windowsMove, 1, 4, bounce

    # Fade animations
    animation = fade, 1, 3, smooth
    animation = fadeIn, 1, 3, snappy
    animation = fadeOut, 1, 2, snappy
    animation = fadeSwitch, 1, 2, snappy
    animation = fadeShadow, 1, 3, snappy
    animation = fadeDim, 1, 3, smooth

    # Layer animations (popups, notifications, bars)
    animation = layers, 1, 4, bounce
    animation = layersIn, 1, 4, bounce, popin 75%
    animation = layersOut, 1, 2, snappy, fade
    animation = fadeLayersIn, 1, 2, snappy
    animation = fadeLayersOut, 1, 2, snappy

    # Workspace animations - bouncy slide
    animation = workspaces, 1, 5, bounce, slidefade 25%
    animation = workspacesIn, 1, 5, bounce, slidefade 25%
    animation = workspacesOut, 1, 4, softPop, slidefade 25%
    animation = specialWorkspace, 1, 5, bounce, slidevert

    # Border animation
    animation = border, 1, 6, smooth
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    font_family = "Segoe UI"
    disable_splash_rendering = true
    disable_hyprland_logo = true

}

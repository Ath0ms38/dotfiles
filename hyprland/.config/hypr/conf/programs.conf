###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = walker

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = systemctl --user start elephant.service
exec-once = walker --gapplication-service
exec-once = hyprpaper
# exec-once = waybar  # Disabled - using Fabric instead
exec-once = ~/.config/fabric/restart.sh
exec-once = swaync
# exec-once = ~/.config/waybar/scripts/window-event-monitor.sh &  # Disabled - Fabric handles workspace events
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"
exec-once = wl-paste --watch cliphist store
exec-once = hyprsunset -t 3000

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
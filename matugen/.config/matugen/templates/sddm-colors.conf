[General]
#################### General ####################

# Screen resolution - adjust to match your display
ScreenWidth="1920"
ScreenHeight="1080"
ScreenPadding="10"

# Font settings
Font="Roboto"
FontSize="14"

# Virtual keyboard for touch screens or accessibility
KeyboardSize="0.4"

# Rounded corners
RoundCorners="15"

# Time and date formatting
Locale=""
HourFormat="HH:mm:ss"
DateFormat="dddd, MMMM d"

# Header text
HeaderText="Welcome Athoms"
subheaderText="おかえりなさい アトムス"

#################### Background ####################

# Wallpaper - synced with matugen
Background="{{image}}"
BackgroundSpeed="1.0"
PauseBackground="false"

# Slight dim to make text more readable
DimBackground="0.2"

# Crop to fill screen while maintaining aspect ratio
CropBackground="true"
BackgroundHorizontalAlignment="center"
BackgroundVerticalAlignment="center"

#################### Colors ####################

# Text colors
HeaderTextColor="{{colors.on_background.default.hex}}"
DateTextColor="{{colors.on_surface_variant.default.hex}}"
TimeTextColor="{{colors.on_surface.default.hex}}"

# Form background
FormBackgroundColor="{{colors.surface_container.default.hex}}"
BackgroundColor="{{colors.surface.default.hex}}"
DimBackgroundColor="{{colors.shadow.default.hex}}"

# Input fields
LoginFieldBackgroundColor="{{colors.surface_container_high.default.hex}}"
PasswordFieldBackgroundColor="{{colors.surface_container_high.default.hex}}"
LoginFieldTextColor="{{colors.on_surface.default.hex}}"
PasswordFieldTextColor="{{colors.on_surface.default.hex}}"
UserIconColor="{{colors.primary.default.hex}}"
PasswordIconColor="{{colors.primary.default.hex}}"

# Placeholder and warning colors
PlaceholderTextColor="{{colors.on_surface_variant.default.hex}}"
WarningColor="{{colors.error.default.hex}}"

# Button colors
LoginButtonTextColor="{{colors.on_primary.default.hex}}"
LoginButtonBackgroundColor="{{colors.primary.default.hex}}"
SystemButtonsIconsColor="{{colors.secondary.default.hex}}"
SessionButtonTextColor="{{colors.on_surface.default.hex}}"
VirtualKeyboardButtonTextColor="{{colors.on_surface.default.hex}}"

# Dropdown menu colors
DropdownTextColor="{{colors.on_surface.default.hex}}"
DropdownSelectedBackgroundColor="{{colors.secondary_container.default.hex}}"
DropdownBackgroundColor="{{colors.surface_container.default.hex}}"

# Highlight colors
HighlightTextColor="{{colors.on_tertiary.default.hex}}"
HighlightBackgroundColor="{{colors.tertiary.default.hex}}"
HighlightBorderColor="{{colors.outline.default.hex}}"

# Hover states
HoverUserIconColor="{{colors.tertiary.default.hex}}"
HoverPasswordIconColor="{{colors.tertiary.default.hex}}"
HoverSystemButtonsIconsColor="{{colors.tertiary.default.hex}}"
HoverSessionButtonTextColor="{{colors.tertiary.default.hex}}"
HoverVirtualKeyboardButtonTextColor="{{colors.tertiary.default.hex}}"

#################### Form ####################

# Blur effects
PartialBlur="true"
FullBlur="false"
BlurMax="32"
Blur="1.0"

# Form positioning
HaveFormBackground="true"
FormPosition="right"

#################### Virtual Keyboard ####################

VirtualKeyboardPosition="right"

#################### Interface Behavior ####################

HideVirtualKeyboard="false"
HideSystemButtons="false"
HideLoginButton="false"

ForceLastUser="true"
PasswordFocus="true"
HideCompletePassword="true"
AllowEmptyPassword="false"
AllowUppercaseLettersInUsernames="false"
BypassSystemButtonsChecks="false"
RightToLeftLayout="false"

#################### Translation ####################

TranslatePlaceholderUsername="Username / ユーザー名"
TranslatePlaceholderPassword="Password / パスワード"
TranslateLogin="Login / ログイン"
TranslateLoginFailedWarning="Login failed! / ログインに失敗しました！"
TranslateCapslockWarning="Caps Lock is on / Caps Lockがオンです"
TranslateSuspend="Sleep / スリープ"
TranslateHibernate="Hibernate / 休止状態"
TranslateReboot="Restart / 再起動"
TranslateShutdown="Shutdown / シャットダウン"
TranslateSessionSelection="Session / セッション"
TranslateVirtualKeyboardButtonOn="Virtual Keyboard (ON)"
TranslateVirtualKeyboardButtonOff="Virtual Keyboard (OFF)"

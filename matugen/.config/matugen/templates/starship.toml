# Matugen-generated Starship configuration
# Auto-generated from wallpaper - do not edit manually

format = """
[┌─](bold {{colors.primary.default.hex}}) $time $username$hostname$directory$git_branch$git_status$python$cmd_duration
[└─](bold {{colors.primary.default.hex}}) $character
"""

add_newline = true

[time]
disabled = false
format = '[\[$time\]](bold {{colors.primary.default.hex}}) '
time_format = "%H:%M:%S"

[username]
style_user = "bold {{colors.cyan.default.hex}}"
style_root = "bold {{colors.red.default.hex}}"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname](bold {{colors.green.default.hex}}) "
disabled = false

[directory]
style = "bold {{colors.blue.default.hex}}"
truncation_length = 3
truncate_to_repo = false
format = "in [$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "bold {{colors.magenta.default.hex}}"
format = "on [$symbol$branch]($style) "
symbol = "󰊢 "

[git_status]
style = "bold {{colors.tertiary.default.hex}}"
format = "[$all_status$ahead_behind]($style)"

[python]
style = "bold {{colors.yellow.default.hex}}"
format = "via [${symbol}${pyenv_prefix}(${version})(\\($virtualenv\\))]($style) "
symbol = " "
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "__init__.py", "pyproject.toml", "requirements.txt", "setup.py", "tox.ini"]

[cmd_duration]
min_time = 2_000
style = "bold {{colors.primary.default.hex}}"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold {{colors.green.default.hex}})"
error_symbol = "[❯](bold {{colors.red.default.hex}})"

[nodejs]
style = "bold {{colors.green.default.hex}}"
format = "via [${symbol}(${version})]($style) "
symbol = " "

[rust]
style = "bold {{colors.tertiary.default.hex}}"
format = "via [${symbol}(${version})]($style) "
symbol = " "

[docker_context]
style = "bold {{colors.blue.default.hex}}"
format = "via [${symbol}$context]($style) "
symbol = " "

[package]
style = "bold {{colors.magenta.default.hex}}"
format = "pkg [${symbol}${version}]($style) "
symbol = "󰏗 "

[memory_usage]
disabled = false
threshold = 70
style = "bold {{colors.tertiary.default.hex}}"
format = "via [${symbol}${ram}]($style) "
symbol = "󰍛 "

[battery]
full_symbol = "🔋"
charging_symbol = "⚡️"
discharging_symbol = "💀"

[[battery.display]]
threshold = 10
style = "bold {{colors.red.default.hex}}"

[[battery.display]]
threshold = 30
style = "bold {{colors.yellow.default.hex}}"

[status]
style = "bold {{colors.red.default.hex}}"
symbol = "✖"
format = '[\[$symbol $common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
disabled = false

[aws]
style = "bold {{colors.primary.default.hex}}"
format = "on [${symbol}($profile)(\\($region\\))]($style) "
symbol = "☁️  "

[kubernetes]
style = "bold {{colors.cyan.default.hex}}"
format = "on [${symbol}$context(\\($namespace\\))]($style) "
symbol = "⎈ "
disabled = false
